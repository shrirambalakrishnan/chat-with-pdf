# Environment variables for the Cloud Run service. Copy this file to
# env.cloudrun.yaml, fill in the values, and pass it with
# `gcloud run deploy --env-vars-file env.cloudrun.yaml`. Same meaning as in
# .env.example. PORT is left out: Cloud Run sets it.
GCP_PROJECT_ID: <project-id>
GCS_BUCKET_NAME: <bucket-name>
FIRESTORE_DATABASE_ID: "(default)"
VERTEX_LOCATION: us-central1
EMBEDDING_MODEL: gemini-embedding-001
EMBEDDING_DIMENSIONS: "768"
CHAT_MODEL: gemini-3.8-flash
CHAT_LOCATION: global
DOCLING_URL: <docling-url>
